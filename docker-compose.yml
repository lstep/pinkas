services:
  go-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    volumes:
      - ./data:/data
    environment:
      - DATA_DIR=/data
      - PORT=3000
    expose:
      - "3000"
    networks:
      - mostdoc

  collab:
    build:
      context: ./collab
    volumes:
      - ./data:/data
    environment:
      - API_URL=http://go-api:3000
      - PORT=3001
      - DB_PATH=/data/collab.db
    expose:
      - "3001"
      - "3002"
    networks:
      - mostdoc

  nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - go-api
      - collab
    networks:
      - mostdoc

networks:
  mostdoc:
    driver: bridge
